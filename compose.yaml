services:
  database:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=Europe/Moscow
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - testo-app-network

  php-fpm:
    image: ghcr.io/v1t5/v1t5/testo-core:master
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
      fluent-bit:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV}
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      - JWT_SECRET=${JWT_SECRET}
      - MESSENGER_TRANSPORT_DSN=${MESSENGER_TRANSPORT_DSN}
      - TZ=Europe/Moscow
    volumes:
      - app_data:/var/www/
    networks:
      - testo-app-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: php.logs

  php-worker:
    image: ghcr.io/v1t5/v1t5/testo-core:master
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
      fluent-bit:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: php bin/console messenger:consume async --verbose
    restart: always
    environment:
      - APP_ENV=${APP_ENV}
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      - JWT_SECRET=${JWT_SECRET}
      - MESSENGER_TRANSPORT_DSN=${MESSENGER_TRANSPORT_DSN}
      - TZ=Europe/Moscow
    volumes:
      - app_data:/var/www/
    networks:
      - testo-app-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: php.logs

  tg-bot:
    image: ghcr.io/v1t5/v1t5/testo-tg-bot:master
    command: php bin/console app:telegram-bot --verbose
    depends_on:
      fluent-bit:
        condition: service_started
    environment:
      - TG_APP_ENV=${APP_ENV}
      - TG_APP_SECRET=${APP_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - APP_BASE_URL=${APP_BASE_URL}
      - API_USER=${API_USER}
      - API_PASSWORD=${API_PASSWORD}
      - TZ=Europe/Moscow
    volumes:
      - app_data:/var/www/
    networks:
      - testo-app-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: php.logs

  nginx:
    image: ghcr.io/v1t5/v1t5/testo-nginx-proxy:master
    depends_on:
      - php-fpm
      - tg-bot
    restart: always
    command: /bin/sh -c "envsubst < /etc/nginx/upstream.template.conf > /etc/nginx/conf.d/default.conf && nginx"
    environment:
      - APP_HOST=php-fpm
    volumes:
      - app_data:/var/www/
    networks:
      - testo-app-network
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: nginx.logs

  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - testo-app-network

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - MESSENGER_TRANSPORT_DSN=${MESSENGER_TRANSPORT_DSN}
      - TZ=Europe/Moscow
    networks:
      - testo-app-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  fluent-bit:
    image: ghcr.io/v1t5/v1t5/testo-fluent:master
    environment:
      - FLB_LOG_LEVEL=info
      - ELASTIC_HOST=${ELASTIC_HOST}
      - ELASTIC_PORT=${ELASTIC_PORT}
      - ELASTIC_INDEX=${ELASTIC_INDEX}
      # Base auth
      - ELASTIC_HTTP_USER=${ELASTIC_HTTP_USER}
      - ELASTIC_HTTP_PASS=${ELASTIC_HTTP_PASS}
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    networks:
      - testo-app-network

volumes:
  database_data:
  app_data:
  redis_data:
  rabbitmq_data:

networks:
  testo-app-network:
    name: testo-app-network
    driver: bridge