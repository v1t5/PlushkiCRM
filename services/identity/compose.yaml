name: plushki-app

# identity — Joins the shared infra stack
# via the external `plushki-shared` network. Four containers run from one image:
# db, a one-shot migrate+bootstrap, the HTTP server, and the outbox relay worker.
#
# Usage from repo root:
#   docker compose -f compose.shared.yaml -f services/identity/compose.yaml up -d

services:
  identity-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=identity
      - POSTGRES_USER=${IDENTITY_DB_USER:-identity}
      - POSTGRES_PASSWORD=${IDENTITY_DB_PASSWORD:-identity}
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER:-identity} -d identity"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks: [shared]

  identity-migrate:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    command: ["sh", "-c", "php bin/console plushki:migrate --no-interaction && php bin/console plushki:bootstrap-admin --no-interaction"]
    environment: &identity-env
      - APP_SERVICE=identity
      - APP_ENV=dev
      - APP_HTTP_ADDR=:8080
      - APP_DATABASE_URL=postgres://${IDENTITY_DB_USER:-identity}:${IDENTITY_DB_PASSWORD:-identity}@identity-db:5432/identity?sslmode=disable
      - APP_AMQP_URL=amqp://${RABBITMQ_USER:-plushki}:${RABBITMQ_PASSWORD:-plushki}@rabbitmq:5672/
      - APP_OTLP_ENDPOINT=http://tempo:4318
      - APP_LOG_LEVEL=info
      - APP_OUTBOX_EXCHANGE=IDENTITY
      - APP_JWT_KEY_ID=k1
      - APP_JWT_ISSUER=https://identity.plushki
      # Dev convenience: grant admin role to this email on every startup if the
      # user already exists (register first, then it is granted on next start).
      - APP_BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@plushki.local}
    depends_on:
      identity-db:
        condition: service_healthy
    networks: [shared]
    restart: "no"

  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    environment: *identity-env
    ports:
      # Dev-only: identity is only reachable through the gateway in prod.
      - "8081:8080"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    networks: [shared]

  identity-relay:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:outbox-relay", "--no-interaction"]
    environment: *identity-env
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    networks: [shared]

volumes:
  identity_db_data:

networks:
  shared:
    name: plushki-shared
    external: true
