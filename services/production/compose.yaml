name: plushki-app

# production — Publisher (outbox/relay →
# PRODUCTION exchange) AND consumer (catalog recipe_updated, orders confirmed).
# Containers: db, one-shot migrate, HTTP server, outbox relay, two consumer
# workers. Accumulates orders.v1.confirmed into a daily plan; publishing the
# plan materialises baker tasks and emits production.v1.plan_published;
# completing a task emits production.v1.task_completed with the recipe snapshot.
#
# Usage from repo root:
#   docker compose -f compose.shared.yaml -f services/production/compose.yaml up -d

services:
  production-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=production
      - POSTGRES_USER=${PRODUCTION_DB_USER:-production}
      - POSTGRES_PASSWORD=${PRODUCTION_DB_PASSWORD:-production}
    volumes:
      - production_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCTION_DB_USER:-production} -d production"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks: [shared]

  production-migrate:
    build:
      context: ./services/production
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:migrate", "--no-interaction"]
    environment: &production-env
      - APP_SERVICE=production
      - APP_ENV=dev
      - APP_HTTP_ADDR=:8080
      - APP_DATABASE_URL=postgres://${PRODUCTION_DB_USER:-production}:${PRODUCTION_DB_PASSWORD:-production}@production-db:5432/production?sslmode=disable
      - APP_AMQP_URL=amqp://${RABBITMQ_USER:-plushki}:${RABBITMQ_PASSWORD:-plushki}@rabbitmq:5672/
      - APP_OTLP_ENDPOINT=http://tempo:4318
      - APP_LOG_LEVEL=info
      - APP_OUTBOX_EXCHANGE=PRODUCTION
    depends_on:
      production-db:
        condition: service_healthy
    networks: [shared]
    restart: "no"

  production:
    build:
      context: ./services/production
      dockerfile: Dockerfile
    environment: *production-env
    ports:
      # Dev-only: production is only reachable through the gateway in prod.
      - "8087:8080"
    depends_on:
      production-migrate:
        condition: service_completed_successfully
    networks: [shared]

  production-relay:
    build:
      context: ./services/production
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:outbox-relay", "--no-interaction"]
    environment: *production-env
    depends_on:
      production-migrate:
        condition: service_completed_successfully
    networks: [shared]

  production-consume-catalog:
    build:
      context: ./services/production
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:consume-catalog", "--no-interaction"]
    environment: *production-env
    depends_on:
      production-migrate:
        condition: service_completed_successfully
    networks: [shared]

  production-consume-orders:
    build:
      context: ./services/production
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:consume-orders", "--no-interaction"]
    environment: *production-env
    depends_on:
      production-migrate:
        condition: service_completed_successfully
    networks: [shared]

volumes:
  production_db_data:

networks:
  shared:
    name: plushki-shared
    external: true
