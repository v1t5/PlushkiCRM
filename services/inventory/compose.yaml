name: plushki-app

# inventory — Publisher (outbox/relay → INVENTORY exchange) AND consumer
# (catalog/orders/production). Containers: db, a one-shot migrate (migrations +
# default-warehouse bootstrap), the HTTP server, the outbox relay, and three
# consumer workers (one per source exchange). Quantities are BIGINT base units.
#
# Usage from repo root:
#   docker compose -f compose.shared.yaml -f services/inventory/compose.yaml up -d

services:
  inventory-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=inventory
      - POSTGRES_USER=${INVENTORY_DB_USER:-inventory}
      - POSTGRES_PASSWORD=${INVENTORY_DB_PASSWORD:-inventory}
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER:-inventory} -d inventory"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks: [shared]

  inventory-migrate:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    # Apply migrations, then bootstrap the default warehouse (idempotent).
    command: ["sh", "-c", "php bin/console plushki:migrate --no-interaction && php bin/console plushki:bootstrap-warehouse --no-interaction"]
    environment: &inventory-env
      - APP_SERVICE=inventory
      - APP_ENV=dev
      - APP_HTTP_ADDR=:8080
      - APP_DATABASE_URL=postgres://${INVENTORY_DB_USER:-inventory}:${INVENTORY_DB_PASSWORD:-inventory}@inventory-db:5432/inventory?sslmode=disable
      - APP_AMQP_URL=amqp://${RABBITMQ_USER:-plushki}:${RABBITMQ_PASSWORD:-plushki}@rabbitmq:5672/
      - APP_OTLP_ENDPOINT=http://tempo:4318
      - APP_LOG_LEVEL=info
      - APP_OUTBOX_EXCHANGE=INVENTORY
      - APP_DEFAULT_WAREHOUSE_CODE=main
      - APP_DEFAULT_WAREHOUSE_NAME=Main warehouse
    depends_on:
      inventory-db:
        condition: service_healthy
    networks: [shared]
    restart: "no"

  inventory:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    environment: *inventory-env
    ports:
      # Dev-only: inventory is only reachable through the gateway in prod.
      - "8086:8080"
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    networks: [shared]

  inventory-relay:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:outbox-relay", "--no-interaction"]
    environment: *inventory-env
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    networks: [shared]

  inventory-consume-catalog:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:consume-catalog", "--no-interaction"]
    environment: *inventory-env
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    networks: [shared]

  inventory-consume-orders:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:consume-orders", "--no-interaction"]
    environment: *inventory-env
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    networks: [shared]

  inventory-consume-production:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:consume-production", "--no-interaction"]
    environment: *inventory-env
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    networks: [shared]

volumes:
  inventory_db_data:

networks:
  shared:
    name: plushki-shared
    external: true
