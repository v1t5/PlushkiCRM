apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: 'trace_id=(\w+)'
          url: '$${__value.raw}'
          datasourceUid: tempo
        - name: traceID
          matcherRegex: '"traceID":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
        filterByTraceID: true
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Phase 4: read-only access to the reporting projection store. Grafana
  # panels query this directly. The reporting service must be up
  # (services/reporting/compose.yaml) for the host to resolve on the shared
  # network; if it's not, the datasource shows as unhealthy until then.
  - name: Reporting
    uid: reporting
    type: postgres
    access: proxy
    url: reporting-db:5432
    user: reporting
    secureJsonData:
      password: reporting
    jsonData:
      database: reporting
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
