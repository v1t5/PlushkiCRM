name: plushki-app

# catalog — Joins the shared infra stack via the external `plushki-shared`
# network. Four containers from one image: db, a one-shot migrate, the HTTP
# server, and the outbox relay worker.
#
# Usage from repo root:
#   docker compose -f compose.shared.yaml -f services/catalog/compose.yaml up -d

services:
  catalog-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=catalog
      - POSTGRES_USER=${CATALOG_DB_USER:-catalog}
      - POSTGRES_PASSWORD=${CATALOG_DB_PASSWORD:-catalog}
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER:-catalog} -d catalog"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks: [shared]

  catalog-migrate:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:migrate", "--no-interaction"]
    environment: &catalog-env
      - APP_SERVICE=catalog
      - APP_ENV=dev
      - APP_HTTP_ADDR=:8080
      - APP_DATABASE_URL=postgres://${CATALOG_DB_USER:-catalog}:${CATALOG_DB_PASSWORD:-catalog}@catalog-db:5432/catalog?sslmode=disable
      - APP_AMQP_URL=amqp://${RABBITMQ_USER:-plushki}:${RABBITMQ_PASSWORD:-plushki}@rabbitmq:5672/
      - APP_OTLP_ENDPOINT=http://tempo:4318
      - APP_LOG_LEVEL=info
      - APP_OUTBOX_EXCHANGE=CATALOG
    depends_on:
      catalog-db:
        condition: service_healthy
    networks: [shared]
    restart: "no"

  catalog:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    environment: *catalog-env
    ports:
      # Dev-only: catalog is only reachable through the gateway in prod.
      - "8082:8080"
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    networks: [shared]

  catalog-relay:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:outbox-relay", "--no-interaction"]
    environment: *catalog-env
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    networks: [shared]

volumes:
  catalog_db_data:

networks:
  shared:
    name: plushki-shared
    external: true