name: plushki-app

# notifications — Joins the shared infra stack via the external `plushki-shared`
# network. Five containers from one image: db, a one-shot migrate, the HTTP
# server (health/metrics only), and two consumer workers — one per source
# exchange (ORDERS, INVENTORY). Telegram runs in dry-run mode unless
# APP_TG_BOT_TOKEN is set; inventory alerts are dropped unless APP_ADMIN_CHAT_ID
# is set.
#
# Usage from repo root:
#   docker compose -f compose.shared.yaml -f services/notifications/compose.yaml up -d

services:
  notifications-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=notifications
      - POSTGRES_USER=${NOTIFICATIONS_DB_USER:-notifications}
      - POSTGRES_PASSWORD=${NOTIFICATIONS_DB_PASSWORD:-notifications}
    volumes:
      - notifications_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATIONS_DB_USER:-notifications} -d notifications"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks: [shared]

  notifications-migrate:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:migrate", "--no-interaction"]
    environment: &notifications-env
      - APP_SERVICE=notifications
      - APP_ENV=dev
      - APP_HTTP_ADDR=:8080
      - APP_DATABASE_URL=postgres://${NOTIFICATIONS_DB_USER:-notifications}:${NOTIFICATIONS_DB_PASSWORD:-notifications}@notifications-db:5432/notifications?sslmode=disable
      - APP_AMQP_URL=amqp://${RABBITMQ_USER:-plushki}:${RABBITMQ_PASSWORD:-plushki}@rabbitmq:5672/
      - APP_OTLP_ENDPOINT=http://tempo:4318
      - APP_LOG_LEVEL=info
      - APP_TG_API_BASE=https://api.telegram.org
      - APP_TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - APP_ADMIN_CHAT_ID=${TG_ADMIN_CHAT_ID:-}
    depends_on:
      notifications-db:
        condition: service_healthy
    networks: [shared]
    restart: "no"

  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    environment: *notifications-env
    ports:
      # Dev-only: notifications is only reachable through the gateway in prod.
      - "8084:8080"
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
    networks: [shared]

  notifications-consume-orders:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:consume-orders", "--no-interaction"]
    environment: *notifications-env
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
    networks: [shared]

  notifications-consume-inventory:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    command: ["php", "bin/console", "plushki:consume-inventory", "--no-interaction"]
    environment: *notifications-env
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
    networks: [shared]

volumes:
  notifications_db_data:

networks:
  shared:
    name: plushki-shared
    external: true
